  const nPG = t.items.filter(x => BANK[x.id].type === 'pg').length;
  const sel = oi => pgk ? (Array.isArray(a) && a.includes(oi)) : a === oi;
  const terjawab = t.items.filter(x => { const v = t.ans[x.id]; return Array.isArray(v) ? v.length : v != null; }).length;
  const batas = CFG.T5_BATAS_MENIT > 0;
  return `<section class="card"><div class="qhead"><div><div class="sect">${pgk ? 'Pilihan ganda kompleks' : 'Pilihan ganda'}</div><span class="kicker">Soal ${t.idx + 1} dari ${t.items.length} · terjawab ${terjawab}</span></div>
    ${batas ? ring('r5', 1, '--:--', 'sisa waktu') : ''}</div>
    <div class="qtext">${esc(q.q)}</div>
    ${pgk ? '<div class="hint">Pilih SEMUA jawaban yang benar.</div>' : ''}
    <div class="opts">${it.order.map((oi, p) => `<button class="opt ${pgk ? 'multi' : ''} ${sel(oi) ? 'sel' : ''}" data-oi="${oi}" aria-pressed="${sel(oi)}"><span class="ltr">${sel(oi) && pgk ? '✓' : LTR[p]}</span><span>${esc(q.o[oi])}</span></button>`).join('')}</div>
    <div class="row" style="margin-top:18px"><button class="btn ghost sm" id="pv5" ${t.idx === 0 ? 'disabled' : ''}>← Sebelumnya</button>
      <button class="btn ghost sm" id="nx5" ${t.idx === t.items.length - 1 ? 'disabled' : ''}>Berikutnya →</button>
      <button class="btn gold right" id="fin5">Kirim Jawaban</button></div>
    <div class="navgrid" aria-label="Navigasi soal">${t.items.map((x, i) => { const v = t.ans[x.id]; const an = Array.isArray(v) ? v.length : v != null; return `<button data-i="${i}" class="${i === t.idx ? 'cur' : an ? 'ans' : ''}" aria-label="Soal ${i + 1}${an ? ' terjawab' : ''}">${i + 1}</button>`; }).join('')}</div>
  </section>`;
}

/* ---------- HASIL ---------- */
function vHasil() {
  const h = S.hasil || hitungHasil();
  const st = S.kirim;
  const stHtml = GURU ? '<div class="status wait">Mode uji coba: hasil tidak dikirim ke Google Sheets.</div>'
    : st === 'terkirim' ? '<div class="status ok">✔ Hasilmu sudah terkirim ke rekap guru. Kode bukti: <b>' + esc(S.id) + '</b></div>'
    : st === 'tidak-pasti' ? '<div class="status wait">⏳ Hasil dikirim, tetapi konfirmasi belum diterima. Catat kode bukti <b>' + esc(S.id) + '</b> dan tunjukkan nilai ini kepada guru. <button class="btn sm" id="rk">Kirim ulang</button></div>'
    : st === 'belum-diatur' ? '<div class="status bad">Alamat Google Sheets belum diatur oleh guru. Foto layar ini sebagai bukti dan tunjukkan kepada guru.</div>'
    : st === 'mengirim' ? '<div class="status wait">⏳ Mengirim hasil…</div>'
    : '<div class="status bad">✘ Hasil belum terkirim (koneksi bermasalah). <button class="btn sm" id="rk">Coba kirim lagi</button><br><small>Jangan tutup halaman ini sebelum berhasil. Kode bukti: <b>' + esc(S.id) + '</b></small></div>';
  const salahList = CFG.TAMPILKAN_PEMBAHASAN ? [...(h.salah4 || []), ...(h.salah5 || [])] : [];
  const rev = salahList.length ? `<details><summary>Lihat soal yang masih keliru (${salahList.length})</summary>${[['4', h.salah4], ['5', h.salah5]].map(([tp, ids]) => (ids || []).map(id => { const q = BANK[id]; const ans = (tp === '4' ? S.t4 : S.t5).ans[id]; const lab = v => v == null || (Array.isArray(v) && !v.length) ? '(tidak dijawab)' : Array.isArray(v) ? v.map(x => q.o[x]).join('; ') : q.o[v]; return `<div class="rev"><b>Tahap ${tp}:</b> ${esc(q.q).replace(/\n/g, '<br>')}<br><span class="a">Jawabanmu: ${esc(lab(ans))}</span><br><span class="k">Kunci: ${esc(lab(q.k))}</span></div>`; }).join('')).join('')}</details>` : '';
  return `<section class="card"><span class="kicker">Petualangan selesai</span><h2>Puncak Moksa Tercapai 🌄</h2>
  <div class="badge"><div class="t">${gelar(h.nilai5)}</div><div>${esc(S.nama)} · ${esc(S.kelas)} · No. ${esc(S.absen)}</div></div>
  <div class="score"><div><b>${h.nilai4}</b><span>Nilai Tahap 4 (${h.b4}/${h.n4})</span></div><div><b>${h.nilai5}</b><span>Nilai Tahap 5 (${h.b5}/${h.n5})</span></div><div><b>${h.rata}</b><span>Rata-rata</span></div><div><b>${poin()}</b><span>Poin Dharma</span></div></div>
  <p>Rincian Tahap 5: pilihan ganda <b>${h.b5pg}</b> benar, pilihan ganda kompleks <b>${h.b5pgk}</b> benar. Durasi total petualangan: <b>${h.durasi} menit</b>.</p>
  ${stHtml}${rev}
  <div class="row" style="margin-top:16px"><button class="btn ghost sm" id="salin">Salin ringkasan hasil</button>${GURU ? '<button class="btn ghost sm" id="rst">Ulangi (mode guru)</button>' : '<button class="btn ghost sm" id="baru">Murid lain di perangkat ini</button>'}</div>
  </section>`;
}
function hitungHasil() {
  const a = skorT4(), b = skorT5();
  const n4 = a.n, n5 = b.n;
  const nilai4 = Math.round(a.b / n4 * 100), nilai5 = Math.round(b.b / n5 * 100);
  S.selesai = S.selesai || Date.now();
  return { b4: a.b, n4, nilai4, salah4: a.salah, b5: b.b, n5, nilai5, b5pg: b.pg, b5pgk: b.pgk, salah5: b.salah, rata: Math.round((nilai4 + nilai5) / 2), durasi: Math.max(1, Math.round((S.selesai - S.mulai) / 60000)) };
}

/* =====================================================================
   PENGIKAT EVENT
   ===================================================================== */
function bind(v) {
  document.querySelectorAll('[data-go="cur"]').forEach(b => b.onclick = () => { view = Math.min(S.stage, 5); render(); });
  if (v === 1 && S.stage === 1) {
    $('#f1').onsubmit = e => {
      e.preventDefault();
      const nama = $('#nama').value.replace(/\s+/g, ' ').trim(); const k = (document.querySelector('input[name=kelas]:checked') || {}).value; const ab = $('#absen').value.trim();
      const er = $('#err');
      if (nama.length < 3) { er.textContent = 'Nama lengkap minimal 3 huruf.'; $('#nama').focus(); return; }
      if (!k) { er.textContent = 'Pilih kelasmu (X-A sampai X-H).'; return; }
      if (!/^\d{1,2}$/.test(ab) || +ab < 1) { er.textContent = 'Nomor absen harus berupa angka 1–99.'; $('#absen').focus(); return; }
      modal(`<h3>Periksa identitasmu</h3><p><b>${esc(nama)}</b><br>Kelas ${esc(k)} · No. absen ${esc(ab)}</p><p>Setelah gerbang dibuka, identitas tidak dapat diubah. Sudah benar?</p><div class="row"><button class="btn ghost sm" id="mn">Periksa lagi</button><button class="btn gold sm right" id="my">Sudah benar</button></div>`, r => {
        r.querySelector('#mn').onclick = () => modal('');
        r.querySelector('#my').onclick = () => { modal(''); Object.assign(S, { nama, kelas: k, absen: ab, stage: 2, mulai: Date.now() }); save(); view = 2; render(); toast('🔓 Gerbang pertama terbuka!'); };
      });
    };
  }
  if (v === 2) bind2();
  if (v === 3) bind3();
  if (v === 4) bind4();
  if (v === 5) bind5();
  if (v === 5 && S.stage > 5) bindHasil();
}

function bind2() {
  const show = id => { topikAktif = id; topikSeen[id] = true; const t = TOPIK.find(x => x.id === id); $('#mat').innerHTML = t.html; document.querySelectorAll('.tab').forEach(b => { b.setAttribute('aria-selected', b.dataset.t === id); b.classList.toggle('seen', !!topikSeen[b.dataset.t]); }); $('#mat').scrollIntoView({ behavior: 'smooth', block: 'start' }); };
  topikSeen[topikAktif] = true; document.querySelectorAll('.tab').forEach(b => { b.classList.toggle('seen', !!topikSeen[b.dataset.t]); b.onclick = () => show(b.dataset.t); });
  const idx = () => TOPIK.findIndex(x => x.id === topikAktif);
  $('#prev').onclick = () => { if (idx() > 0) show(TOPIK[idx() - 1].id); else toast('Ini topik pertama.'); };
  $('#next').onclick = () => { if (idx() < TOPIK.length - 1) show(TOPIK[idx() + 1].id); else toast('Ini topik terakhir.'); };
  if (S.stage !== 2) return;
  let n = 0;
  tick = setInterval(() => {
    if (document.hidden) return;                // hanya menghitung saat halaman terlihat
    S.t2Sisa = Math.max(0, S.t2Sisa - 1); if (++n % 5 === 0) save();
    setRing('r2', S.t2Sisa / CFG.T2_DETIK, fmt(S.t2Sisa), S.t2Sisa <= 60);
    const b = $('#go3');
    if (b) { if (S.t2Sisa > 0) b.textContent = '🔒 Terbuka dalam ' + fmt(S.t2Sisa); else { b.disabled = false; b.textContent = 'Buka Tahap 3: Desa Dharma →'; stopTick(); save(); toast('⏳ Waktu belajar selesai. Tahap 3 terbuka!'); } }
  }, 1000);
  const b = $('#go3'); if (S.t2Sisa <= 0) { b.disabled = false; b.textContent = 'Buka Tahap 3: Desa Dharma →'; stopTick(); }
  b.onclick = () => { if (S.t2Sisa > 0) return; S.stage = 3; save(); view = 3; render(); toast('🔓 Tahap 3 terbuka!'); };
}
function bind3() {
  document.querySelectorAll('.sc .opt').forEach(b => b.onclick = () => { if (S.stage !== 3) return; S.t3[+b.dataset.sc] = +b.dataset.j; save(); const y = window.scrollY; render(); window.scrollTo({ top: y }); });
  const k = $('#komit'); if (k) k.oninput = () => { S.komitmen = k.value; save(); };
  const g = $('#go4'); if (g) g.onclick = () => { if (S.komitmen.trim().length < 20) { $('#err3').textContent = 'Tulis komitmenmu minimal 20 karakter.'; return; } S.stage = 4; save(); view = 4; render(); toast('🔓 Tahap 4 terbuka!'); };
}
function bind4() {
  const s = $('#start4'); if (s) s.onclick = () => { initT4(); render(); };
  const g = $('#go5'); if (g) g.onclick = () => { S.stage = 5; save(); view = 5; render(); toast('🔓 Puncak Moksa terbuka!'); };
  if (!S.t4 || S.t4.done) return;
  const t = S.t4; const it = t.items[t.idx]; const q = BANK[it.id];
  document.querySelectorAll('.opt').forEach(b => b.onclick = () => { if (it.id in t.ans) return; t.ans[it.id] = +b.dataset.oi; save(); const y = window.scrollY; render(); window.scrollTo({ top: y }); const f = $('.fb'); if (f) f.scrollIntoView({ behavior: 'smooth', block: 'center' }); });
  const nx = $('#nx4');
  if (nx) nx.onclick = () => { if (t.idx < t.items.length - 1) { t.idx++; } else { t.done = true; } save(); render(); };
  if (!(it.id in t.ans)) {
    tick = setInterval(() => {
      const rem = Math.max(0, CFG.T4_DETIK_PER_SOAL - Math.floor((Date.now() - t.qStart[it.id]) / 1000));
      setRing('r4', rem / CFG.T4_DETIK_PER_SOAL, fmt(rem), rem <= 20);
      if (rem <= 0) { t.ans[it.id] = null; save(); render(); toast('⏰ Waktu habis untuk soal ini'); }
    }, 250);
  }
}
function bind5() {
  const s = $('#start5'); if (s) s.onclick = () => { initT5(); render(); };
  if (!S.t5 || S.t5.done) return;
  const t = S.t5; const it = t.items[t.idx]; const q = BANK[it.id];
  document.querySelectorAll('.opts .opt').forEach(b => b.onclick = () => {
    const oi = +b.dataset.oi;
    if (q.type === 'pgk') { const cur = Array.isArray(t.ans[it.id]) ? t.ans[it.id].slice() : []; const i = cur.indexOf(oi); i > -1 ? cur.splice(i, 1) : cur.push(oi); t.ans[it.id] = cur; }
    else t.ans[it.id] = oi;
    save(); const y = window.scrollY; render(); window.scrollTo({ top: y });
  });
  document.querySelectorAll('.navgrid button').forEach(b => b.onclick = () => { t.idx = +b.dataset.i; save(); render(); });
  $('#pv5').onclick = () => { if (t.idx > 0) { t.idx--; save(); render(); } };
  $('#nx5').onclick = () => { if (t.idx < t.items.length - 1) { t.idx++; save(); render(); } };
  $('#fin5').onclick = () => {
    const kosong = t.items.filter(x => { const v = t.ans[x.id]; return Array.isArray(v) ? !v.length : v == null; }).length;
    modal(`<h3>Kirim jawaban?</h3><p>${kosong ? `Masih ada <b>${kosong} soal</b> belum dijawab. ` : 'Semua soal sudah terjawab. '}Setelah dikirim, jawaban tidak dapat diubah.</p><div class="row"><button class="btn ghost sm" id="mn">Kembali</button><button class="btn gold sm right" id="my">Ya, kirim</button></div>`, r => {
      r.querySelector('#mn').onclick = () => modal('');
      r.querySelector('#my').onclick = () => { modal(''); selesaiT5(); };
    });
  };
  if (CFG.T5_BATAS_MENIT > 0) {
    const end = t.start + CFG.T5_BATAS_MENIT * 60000;
    tick = setInterval(() => { const rem = Math.max(0, (end - Date.now()) / 1000); setRing('r5', rem / (CFG.T5_BATAS_MENIT * 60), fmt(rem), rem <= 120); if (rem <= 0) { stopTick(); toast('⏰ Waktu habis, jawaban dikirim otomatis'); selesaiT5(); } }, 500);
  }
}
function selesaiT5() {
  stopTick();
  S.t5.done = true; S.selesai = Date.now(); S.hasil = hitungHasil(); S.stage = 6; save(); view = 5; render();
  kirimHasil();
}
function bindHasil() {
  const rk = $('#rk'); if (rk) rk.onclick = () => kirimHasil();
  const sl = $('#salin'); if (sl) sl.onclick = () => { const h = S.hasil; const tx = `Petualangan Dharma – ${S.nama} (${S.kelas}/${S.absen})\nNilai Tahap 4: ${h.nilai4}\nNilai Tahap 5: ${h.nilai5}\nRata-rata: ${h.rata}\nKode bukti: ${S.id}`; (navigator.clipboard ? navigator.clipboard.writeText(tx) : Promise.reject()).then(() => toast('Ringkasan disalin'), () => toast('Salin manual: foto layar ini')); };
  const bn = $('#baru'); if (bn) bn.onclick = () => modal(`<h3>Murid lain di perangkat ini?</h3><p>Data lokal perangkat akan dibersihkan. Hasil yang sudah terkirim tetap aman di rekap guru.${S.kirim !== 'terkirim' && !GURU ? '<br><b>Perhatian: hasilmu belum terkonfirmasi terkirim.</b>' : ''}</p><div class="row"><button class="btn ghost sm" id="mn">Batal</button><button class="btn sm right" id="my">Ya, mulai baru</button></div>`, r => { r.querySelector('#mn').onclick = () => modal(''); r.querySelector('#my').onclick = () => { try { localStorage.removeItem(STORE_KEY); } catch (e) {} location.href = location.pathname + (GURU ? '?guru=1' : ''); }; });
  const rs = $('#rst'); if (rs) rs.onclick = () => { try { localStorage.removeItem(STORE_KEY); } catch (e) {} location.href = location.pathname + '?guru=1'; };
}

/* =====================================================================
   PENGIRIMAN KE GOOGLE SHEETS (Apps Script Web App)
   ===================================================================== */
function payload() {
  const h = S.hasil;
  const bijak = SKENARIO.reduce((n, s, i) => n + (S.t3[i] === s.k ? 1 : 0), 0);
  return { id: S.id, nama: S.nama, kelas: S.kelas, absen: S.absen, mulai: new Date(S.mulai).toISOString(), selesai: new Date(S.selesai).toISOString(), durasi: h.durasi, komitmen: S.komitmen, bijak,
    t4Benar: h.b4, t4Nilai: h.nilai4, t4Salah: h.salah4.join(', '), t5Pg: h.b5pg, t5Pgk: h.b5pgk, t5Benar: h.b5, t5Nilai: h.nilai5, t5Salah: h.salah5.join(', '), rata: h.rata, away: S.away };
}
async function kirimHasil() {
  if (GURU) { render(); return; }
  if (!CFG.APPS_SCRIPT_URL || CFG.APPS_SCRIPT_URL.indexOf('PASTE_') === 0) { S.kirim = 'belum-diatur'; save(); render(); return; }
  S.kirim = 'mengirim'; render();
  const body = JSON.stringify(payload());
  try {
    const r = await fetch(CFG.APPS_SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body });
    const j = await r.json();
    S.kirim = j && j.ok ? 'terkirim' : 'gagal';
  } catch (e1) {
    try { await fetch(CFG.APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body }); S.kirim = 'tidak-pasti'; }
    catch (e2) { S.kirim = 'gagal'; }
  }
  save(); if (view === 5 || S.stage > 5) render();
}

/* pemantau pindah tab saat ujian */
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) return;
  const ujian = (S.stage === 4 && S.t4 && !S.t4.done) || (S.stage === 5 && S.t5 && !S.t5.done);
  if (ujian) { S.away = (S.away || 0) + 1; save(); }
});

/* mulai */
if (S.stage > 5 && S.hasil && S.kirim === 'mengirim') S.kirim = 'gagal';
render();
</script>
</body>
